name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-tests.yml"
      - "docker-compose.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-tests.yml"
      - "docker-compose.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incidentflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incidentflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/incidentflow?sslmode=disable
      PORT: 8080
      JWT_SECRET: supersecretkey
      LOG_LEVEL: debug
      LOG_FORMAT: text

    defaults:
      run:
        working-directory: ./apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Run backend tests
        run: go test ./tests -v